<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kadans</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kadans">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1113" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: one screen, phone-first. Big tempo dial on top, fine-tune row, presets, start button, settings card below. */
:root{
  --bg:#f2f3ee; --surface:#ffffff; --ink:#111416; --muted:#626a70; --line:#dfe2da;
  --accent:#5c8a00; --accent-strong:#c6f432; --accent-ink:#0e1113; --ring:#e3e8d6;
  --stop:#e5484d;
  --f-display:ui-rounded,"SF Pro Rounded",ui-sans-serif,system-ui,sans-serif;
  --f-body:ui-sans-serif,system-ui,sans-serif;
  --f-mono:ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1113; --surface:#171b1e; --ink:#eef1ea; --muted:#8e979c; --line:#262c30;
  --accent:#c6f432; --accent-strong:#c6f432; --accent-ink:#0e1113; --ring:#1f2a14;
  --stop:#ff6369; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1113; --surface:#171b1e; --ink:#eef1ea; --muted:#8e979c; --line:#262c30;
  --accent:#c6f432; --accent-strong:#c6f432; --accent-ink:#0e1113; --ring:#1f2a14;
  --stop:#ff6369; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.de{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.03em}
.wrap{max-width:480px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}

header{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.66rem;color:var(--muted);letter-spacing:.05em}
.stats{display:flex;gap:14px;text-align:right}
.stats b{display:block;font-family:var(--f-display);font-size:1.05rem;line-height:1.1}
.stats span{font-size:.68rem;color:var(--muted)}

/* dial */
.dial{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:4px auto 0;display:grid;place-items:center}
.dial .ring{position:absolute;inset:0;border-radius:50%;border:10px solid var(--ring)}
.dial .pulse{position:absolute;inset:0;border-radius:50%;border:10px solid var(--accent-strong);opacity:0;transform:scale(.94)}
.dial .pulse.hit{animation:hit .32s ease-out}
.dial .pulse.hit.acc{animation:hitA .38s ease-out}
@keyframes hit{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.07)}}
@keyframes hitA{0%{opacity:1;transform:scale(1.02);border-width:16px}100%{opacity:0;transform:scale(1.1)}}
.dial .core{text-align:center;display:grid;gap:2px}
.bpm{font-family:var(--f-display);font-weight:800;font-size:clamp(4.2rem,22vw,6rem);line-height:.9;letter-spacing:-.04em}
.unit{font-size:.85rem;color:var(--muted)}
.zone{display:inline-block;margin:6px auto 0;padding:3px 10px;border-radius:999px;background:var(--ring);font-weight:700;font-size:.78rem}
.dots{display:flex;gap:8px;justify-content:center;height:10px;margin-top:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .08s}
.dots i.on{background:var(--accent)}

/* fine tune */
.tune{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tune button{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem;cursor:pointer;touch-action:manipulation}
.tune button:active{transform:scale(.96)}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}

.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;cursor:pointer;display:grid;gap:1px;touch-action:manipulation}
.presets b{font-family:var(--f-display);font-size:1.05rem}
.presets span{font-size:.66rem;color:var(--muted)}
.presets button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.main{display:grid;grid-template-columns:1fr auto;gap:10px}
.go{height:72px;border:0;border-radius:20px;background:var(--accent-strong);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation}
.go.on{background:var(--stop);color:#fff}
.go:active{transform:scale(.98)}
.tap{height:72px;width:96px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;display:grid;place-content:center;gap:0;touch-action:manipulation}
.tap span{font-size:.66rem;color:var(--muted);font-weight:400}
.tap:active{transform:scale(.95);background:var(--ring)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{font-weight:600}
.row .de{display:block;font-weight:400}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button.sel{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.row input[type=range]{max-width:150px}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(20px)}
.hint{font-size:.78rem;color:var(--muted);text-align:center;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Kadans<small>LAUF-METRONOM</small></div>
    <div class="stats num">
      <div><b id="time">0:00</b><span>süre</span></div>
      <div><b id="steps">0</b><span>adım</span></div>
    </div>
  </header>

  <div class="dial" aria-live="polite">
    <div class="ring"></div>
    <div class="pulse" id="pulse"></div>
    <div class="core">
      <div class="bpm num" id="bpm">170</div>
      <div class="unit">adım / dk <span class="de">· Schritte/Min</span></div>
      <div><span class="zone" id="zone">Tempo</span></div>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <div class="tune">
    <button data-d="-5">−5</button><button data-d="-1">−1</button>
    <button data-d="1">+1</button><button data-d="5">+5</button>
  </div>
  <input type="range" id="slider" min="100" max="220" step="1" aria-label="Ritim">

  <div class="presets" id="presets"></div>

  <div class="main">
    <button class="go" id="go"><span id="goIcon">▶</span><span id="goTxt">Başla</span></button>
    <button class="tap" id="tap">TAP<span>adımına bas</span></button>
  </div>

  <div class="card">
    <div class="row"><label>Ses<span class="de">Klang</span></label>
      <div class="seg" id="sound"></div></div>
    <div class="row"><label>Vurgu<span class="de">Betonung</span></label>
      <div class="seg" id="accent"></div></div>
    <div class="row"><label>Ses seviyesi<span class="de">Lautstärke</span></label>
      <input type="range" id="vol" min="0" max="100"></div>
    <div class="row"><label for="wake">Ekran açık kalsın<span class="de">Bildschirm an</span></label>
      <input type="checkbox" class="sw" id="wake"></div>
  </div>
  <p class="hint">İpucu: koşarken telefonun sessiz modda olsa da ses gelir. Ekran kilitlenince ses kesilirse “Ekran açık kalsın”ı aç.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const MIN=60,MAX=240;
const PRESETS=[[120,"Yürüyüş"],[155,"Hafif"],[170,"Tempo"],[180,"Hızlı"],[190,"Sprint"]];
const SOUNDS=[["click","Tık"],["wood","Tahta"],["beep","Bip"],["drum","Davul"]];
const ACCENTS=[[1,"Yok"],[2,"2"],[4,"4"]];

// settings, kept on this phone only
const S=Object.assign({bpm:170,sound:"click",accent:1,vol:80,wake:true},(()=>{try{return JSON.parse(localStorage.getItem("ritim")||"{}")}catch(e){return{}}})());
const save=()=>{try{localStorage.setItem("ritim",JSON.stringify(S))}catch(e){}};

function zoneName(b){return b<140?"Yürüyüş":b<160?"Hafif koşu":b<175?"Tempo":b<185?"Hızlı":"Sprint"}

/* ---------- audio ---------- */
let ctx=null,gain=null,cur=null,playing=false,segId=0;

// one click sound as raw samples; accent = louder and higher
function voice(kind,acc,sr){
  const len=Math.floor(sr*(kind==="drum"?0.14:kind==="beep"?0.07:0.05));
  const out=new Float32Array(len);
  for(let i=0;i<len;i++){
    const t=i/sr;let v=0;
    if(kind==="click"){const f=acc?2600:1800;v=Math.sin(2*Math.PI*f*t)*Math.exp(-t/0.012)}
    else if(kind==="wood"){const f=acc?1250:880;v=(Math.sin(2*Math.PI*f*t)+.5*Math.sin(2*Math.PI*f*1.47*t))*Math.exp(-t/0.018)*.75+(Math.random()*2-1)*Math.exp(-t/0.002)*.4}
    else if(kind==="beep"){const f=acc?1500:1000;const env=Math.min(1,t/0.003)*Math.min(1,(0.07-t)/0.015);v=Math.sin(2*Math.PI*f*t)*env*.7}
    else{const f0=acc?190:150,f1=50;const ph=2*Math.PI*(f1*t+(f0-f1)*0.03*(1-Math.exp(-t/0.03)));v=Math.sin(ph)*Math.exp(-t/0.05)+(Math.random()*2-1)*Math.exp(-t/0.003)*.25}
    out[i]=v*(acc?1:0.75);
  }
  return out;
}
// a whole bar (accent beats) as one looping buffer: sample-accurate and keeps going without timers
function buildBar(){
  const sr=ctx.sampleRate,beats=S.accent,beat=Math.round(sr*60/S.bpm);
  const buf=ctx.createBuffer(1,beat*beats,sr),d=buf.getChannelData(0);
  for(let b=0;b<beats;b++){const v=voice(S.sound,beats>1&&b===0,sr);d.set(v.subarray(0,Math.min(v.length,beat)),b*beat)}
  return {buf,beatDur:beat/sr,beats};
}
function ensureCtx(){
  if(ctx)return;
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}  // iOS: play even with silent switch on
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  gain=ctx.createGain();gain.connect(ctx.destination);setVol();
}
function setVol(){if(gain){const v=S.vol/100;gain.gain.setTargetAtTime(v*v,ctx.currentTime,0.02)}}
// (re)start the loop at time `at`, stopping whatever is playing at that moment
function schedule(at){
  const bar=buildBar(),src=ctx.createBufferSource();
  src.buffer=bar.buf;src.loop=true;src.connect(gain);src.start(at);
  if(cur)cur.src.stop(at);
  cur={src,start:at,beatDur:bar.beatDur,beats:bar.beats,id:++segId};
}
function nextBeatTime(){
  const now=ctx.currentTime+0.03;
  const k=Math.max(0,Math.ceil((now-cur.start)/cur.beatDur));
  return cur.start+k*cur.beatDur;
}
function retune(){if(playing&&cur)schedule(nextBeatTime())}

let runStart=0,stepCount=0,lastSeen=null,tick=null;
async function start(){
  ensureCtx();
  if(ctx.state!=="running")await ctx.resume();
  cur=null;schedule(ctx.currentTime+0.06);
  playing=true;runStart=Date.now();stepCount=0;lastSeen=null;
  $("go").classList.add("on");$("goIcon").textContent="■";$("goTxt").textContent="Durdur";
  wakeOn();mediaSession(true);
  requestAnimationFrame(frame);
  tick=setInterval(showTime,500);showTime();
}
function stop(){
  playing=false;
  if(cur){try{cur.src.stop()}catch(e){}cur=null}
  $("go").classList.remove("on");$("goIcon").textContent="▶";$("goTxt").textContent="Başla";
  clearInterval(tick);wakeOff();mediaSession(false);drawDots(-1);
}
function showTime(){
  const s=Math.floor((Date.now()-runStart)/1000);
  $("time").textContent=s>=3600?`${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`:`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}

/* ---------- visuals ---------- */
function frame(){
  if(!playing)return;
  const lat=(ctx.outputLatency||ctx.baseLatency||0);
  const el=ctx.currentTime-lat-cur.start;
  if(el>=0){
    const idx=Math.floor(el/cur.beatDur);
    if(!lastSeen||lastSeen.id!==cur.id||lastSeen.idx!==idx){
      lastSeen={id:cur.id,idx};stepCount++;
      $("steps").textContent=stepCount;
      const inBar=idx%cur.beats;
      const p=$("pulse");p.classList.remove("hit","acc");void p.offsetWidth;
      p.classList.add("hit");if(cur.beats>1&&inBar===0)p.classList.add("acc");
      drawDots(inBar);
    }
  }
  requestAnimationFrame(frame);
}
function drawDots(on){
  const n=S.accent>1?S.accent:0,d=$("dots");
  if(d.children.length!==n)d.innerHTML="<i></i>".repeat(n);
  [...d.children].forEach((x,i)=>x.classList.toggle("on",i===on));
}

/* ---------- controls ---------- */
function setBpm(v){
  S.bpm=Math.max(MIN,Math.min(MAX,Math.round(v)));save();
  $("bpm").textContent=S.bpm;$("slider").value=S.bpm;$("zone").textContent=zoneName(S.bpm);
  [...$("presets").children].forEach(b=>b.classList.toggle("sel",+b.dataset.b===S.bpm));
  retune();
}
document.querySelectorAll(".tune button").forEach(b=>b.onclick=()=>setBpm(S.bpm+ +b.dataset.d));
$("slider").oninput=e=>setBpm(+e.target.value);
$("presets").innerHTML=PRESETS.map(([b,n])=>`<button data-b="${b}"><b class="num">${b}</b><span>${n}</span></button>`).join("");
[...$("presets").children].forEach(b=>b.onclick=()=>setBpm(+b.dataset.b));

function seg(id,items,key,after){
  const el=$(id);
  el.innerHTML=items.map(([v,n])=>`<button data-v="${v}">${n}</button>`).join("");
  const mark=()=>[...el.children].forEach(b=>b.classList.toggle("sel",b.dataset.v==String(S[key])));
  [...el.children].forEach(b=>b.onclick=()=>{S[key]=typeof S[key]==="number"?+b.dataset.v:b.dataset.v;save();mark();after&&after();});
  mark();
}
seg("sound",SOUNDS,"sound",()=>{retune();if(!playing)preview()});
seg("accent",ACCENTS,"accent",()=>{retune();drawDots(-1)});
$("vol").value=S.vol;$("vol").oninput=e=>{S.vol=+e.target.value;save();setVol()};
$("wake").checked=S.wake;$("wake").onchange=e=>{S.wake=e.target.checked;save();playing&&S.wake?wakeOn():wakeOff()};

// short sample of the chosen sound when stopped
async function preview(){
  ensureCtx();if(ctx.state!=="running")await ctx.resume();
  const sr=ctx.sampleRate,v=voice(S.sound,false,sr),b=ctx.createBuffer(1,v.length,sr);
  b.getChannelData(0).set(v);const s=ctx.createBufferSource();s.buffer=b;s.connect(gain);s.start();
}

$("go").onclick=()=>playing?stop():start();

// tap tempo: average of the last taps, reset after a 2 s pause
let taps=[];
$("tap").addEventListener("pointerdown",()=>{
  const t=performance.now();
  if(taps.length&&t-taps[taps.length-1]>2000)taps=[];
  taps.push(t);if(taps.length>8)taps.shift();
  if(taps.length>=3){const avg=(taps[taps.length-1]-taps[0])/(taps.length-1);setBpm(60000/avg)}
});

/* ---------- keep running ---------- */
let lock=null;
async function wakeOn(){if(!S.wake||!("wakeLock" in navigator))return;try{lock=await navigator.wakeLock.request("screen")}catch(e){}}
function wakeOff(){if(lock){lock.release().catch(()=>{});lock=null}}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"||!playing)return;
  wakeOn();
  if(ctx.state!=="running")ctx.resume();
});
function mediaSession(on){
  if(!("mediaSession" in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:`Kadans · ${S.bpm} adım/dk`,artist:"Kadans",artwork:[{src:"icon-512.png",sizes:"512x512",type:"image/png"}]});
    navigator.mediaSession.playbackState=on?"playing":"paused";
    navigator.mediaSession.setActionHandler("play",()=>{if(!playing)start()});
    navigator.mediaSession.setActionHandler("pause",()=>{if(playing)stop()});
  }catch(e){}
}

setBpm(S.bpm);drawDots(-1);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
